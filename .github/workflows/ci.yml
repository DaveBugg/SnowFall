name: CI

on:
  push:
    branches: [main, "mac/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (app, installer, tests)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: cmd
        run: build.bat build Release
      - name: Unit tests
        shell: cmd
        working-directory: build
        run: |
          snow_sim_tests.exe || exit /b 1
          snow_settings_tests.exe || exit /b 1
          snow_settings_win_tests.exe || exit /b 1
      # Pixel/window integration self-tests need an interactive desktop and are run locally
      # (tracker_dump, render_demo, ui_demo, e2e_smoke) — see docs/development.md.
      - name: Package
        shell: cmd
        run: |
          mkdir dist
          copy build\SnowFallSetup.exe dist\
          powershell -NoProfile -Command "Compress-Archive -Force -Path build\SnowFall.exe,README.md,LICENSE.md -DestinationPath dist\SnowFall-portable-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: SnowFall-windows-x64
          path: dist/*

  core:
    name: Portable core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # macOS: the Xcode generator, because it is the one CMake generator that builds the
      # SwiftUI module (platform/macos/ui) for arm64 + x86_64 in one go -> universal SnowFall.app.
      - name: Build core and tests
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -G Xcode
            cmake --build build --config Release --parallel -- -quiet
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel
          fi
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      # Full self-test log of the app (Metal, overlays, tracker, UI module) for the record.
      - name: App self-test (macOS)
        if: runner.os == 'macOS' && !cancelled()
        run: |
          APP=$(find build -maxdepth 2 -name SnowFall.app -type d | head -1)
          lipo -info "$APP/Contents/MacOS/SnowFall"
          codesign --verify --verbose "$APP"
          "$APP/Contents/MacOS/SnowFall" --selftest
      # macOS: the app bundle and the dmg are uploaded for manual testing.
      - name: Collect macOS app
        if: runner.os == 'macOS' && !cancelled()
        run: |
          mkdir -p dist
          find build -maxdepth 3 -name "*.dmg" -exec cp {} dist/ \; || true
          APP=$(find build -maxdepth 2 -name SnowFall.app -type d | head -1)
          if [ -n "$APP" ]; then ditto -c -k --keepParent "$APP" dist/SnowFall-macOS-app.zip; fi
          ls -la dist
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS' && !cancelled()
        with:
          name: SnowFall-macos
          path: dist/*
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SnowFall-windows-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: SnowFall-macos
          path: dist-mac
      # macOS: ship the dmg only (the app zip is for CI testing).
      - run: cp dist-mac/*.dmg dist/ && ls -la dist
      # Checksums of every asset, signed with the release key (ECDSA P-256 / SHA-256, DER). The
      # in-app updater installs only files listed in a correctly signed SHA256SUMS
      # (core/update/update.h); without the secret the release gets no .sig and the app offers
      # the download page instead.
      - name: Checksums and signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/release-key.pem" -out SHA256SUMS.sig SHA256SUMS
            openssl ec -in "$RUNNER_TEMP/release-key.pem" -pubout -out "$RUNNER_TEMP/release-pub.pem"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/release-pub.pem" -signature SHA256SUMS.sig SHA256SUMS
            rm -f "$RUNNER_TEMP/release-key.pem"
          else
            echo "::warning::RELEASE_SIGNING_KEY is not set: no SHA256SUMS.sig, in-app updates will offer the download page only"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
