name: CI

on:
  push:
    branches: [main, "mac/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (app, installer, tests)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: cmd
        run: build.bat build Release
      - name: Unit tests
        shell: cmd
        working-directory: build
        run: |
          snow_sim_tests.exe || exit /b 1
          snow_settings_tests.exe || exit /b 1
          snow_settings_win_tests.exe || exit /b 1
      # Pixel/window integration self-tests need an interactive desktop and are run locally
      # (tracker_dump, render_demo, ui_demo, e2e_smoke) — see docs/development.md.
      - name: Package
        shell: cmd
        run: |
          mkdir dist
          copy build\SnowFallSetup.exe dist\
          powershell -NoProfile -Command "Compress-Archive -Force -Path build\SnowFall.exe,README.md,LICENSE.md -DestinationPath dist\SnowFall-portable-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: SnowFall-windows-x64
          path: dist/*

  core:
    name: Portable core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Ninja on macOS: CMake builds Swift (platform/macos/ui) only with Ninja or Xcode.
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: command -v ninja || brew install ninja
      - name: Build core and tests
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then GEN="-G Ninja"; KEEP="-- -k 0"; else GEN=""; KEEP=""; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $KEEP
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      # Full self-test log of the app (Metal, overlays, tracker) for the record.
      - name: App self-test (macOS)
        if: runner.os == 'macOS' && !cancelled()
        run: |
          if [ -x build/SnowFall.app/Contents/MacOS/SnowFall ]; then build/SnowFall.app/Contents/MacOS/SnowFall --selftest; fi
      # macOS: the app bundle / dmg (when platform/macos exists) are uploaded for manual testing.
      - name: Collect macOS app
        if: runner.os == 'macOS' && !cancelled()
        run: |
          mkdir -p dist
          find build -maxdepth 3 -name "*.dmg" -exec cp {} dist/ \; || true
          if [ -d build/SnowFall.app ]; then ditto -c -k --keepParent build/SnowFall.app dist/SnowFall-macOS-app.zip; fi
          ls -la dist
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS' && !cancelled()
        with:
          name: SnowFall-macos
          path: dist/*
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SnowFall-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
